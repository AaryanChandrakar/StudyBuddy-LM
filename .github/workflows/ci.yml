name: build-and-lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Lint backend
        working-directory: server
        run: npm run lint -- --max-warnings=0

      - name: Install frontend deps
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: client
        run: npm run lint -- --max-warnings=0

      - name: Build backend Docker image
        run: docker build -t backend ./server

      - name: Build frontend Docker image
        run: docker build -t frontend ./client

  deploy:
    needs: build-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Add AWS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}

      - name: Write SSH Key
        run: |
          echo "${AWS_KEY}" > AWS_KEY.pem
          chmod 600 AWS_KEY.pem
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}

      - name: Deploy on AWS (git pull + docker compose up -d --build)
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          ssh -i AWS_KEY.pem ${AWS_USER}@${AWS_HOST} << EOF
            set -e
            cd "${AWS_APP_DIR}"

            git fetch --all
            git reset --hard origin/main

            docker compose up -d --build

            echo "Waiting for services to start..."
            sleep 10

            docker image prune -f

            docker compose ps
          EOF
