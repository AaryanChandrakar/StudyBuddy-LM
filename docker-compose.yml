services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: thinklm-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - thinklm-net
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thinklm-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      - qdrant
    networks:
      - thinklm-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: thinklm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - thinklm-net

volumes:
  qdrant_storage:
    driver: local

networks:
  thinklm-net:
    external: true
